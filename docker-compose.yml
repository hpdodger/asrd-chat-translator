services:
  libretranslate:
    image: libretranslate/libretranslate
    user: "0"
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,ru}
      LT_API_KEYS: ${LT_API_KEYS:-false}
    volumes:
      - lt_models:/home/libretranslate/.local/share/argos-translate
  translator:
    build:
      context: ./node
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - libretranslate
    environment:
      GAME_DATA_PATH: /gamedata
      LIBRETRANSLATE_URL: http://libretranslate:5000
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
    volumes:
      - type: bind
        source: ${HOST_GAME_DATA_PATH}
        target: /gamedata

volumes:
  lt_models:
